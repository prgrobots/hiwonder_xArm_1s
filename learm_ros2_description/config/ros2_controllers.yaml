# ros2_control configuration for the LeArm simulation.
#
# The robot is driven by ros2_control's mock hardware
# (mock_components/GenericSystem). No physical arm and no Gazebo are used.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow
      - wrist_flex
      - wrist_roll
      - grip_left
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: false
    # xarm_sim sends goals that only name the servos being moved. Unnamed
    # joints hold their current position, matching the real arm.
    allow_partial_joints_goal: true
