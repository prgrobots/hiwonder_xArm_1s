[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xarm-sim"
version = "0.1.0"
description = "Drop-in simulation of the Hiwonder xArm/LeArm Python API, backed by ROS 2"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PRG Robots" }]
keywords = ["ros2", "xarm", "learm", "robotics", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/prgrobots/hiwonder_xArm_1s"
Repository = "https://github.com/prgrobots/hiwonder_xArm_1s"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
